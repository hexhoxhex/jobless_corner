[package]
name = "vijanabarubaru"
version = "0.1.319"
description = "Vijana BaruBaru desktop: movies, series and live TV."
authors = ["hexhoxhex"]
edition = "2021"

[lib]
# `_lib` suffix: on Windows the .exe and .dll can't share a stem.
name = "vijanabarubaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
