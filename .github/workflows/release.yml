name: Release APK, desktop and iPhone apps

# Cuts a GitHub release whenever a `v*.*.*` tag is pushed. Jobs:
#   - apk:             Ubuntu runner, signs with the hexhoxhex keystore.
#   - desktop:         the desktop app (desktop-web/, Tauri) on Windows,
#                      macOS and Linux; unsigned (SmartScreen / Gatekeeper
#                      warn once).
#   - desktop-release: attaches every desktop installer in one go.
#   - ipa:             macOS runner, the iPhone/iPad app (ios/), unsigned
#                      for Sideloadly; skipped for tags from before it existed.
# The release notes are edited by one job at a time (each waits for the last).

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual re-run from the Actions tab if the tag-trigger build
  # failed before the upload step.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.20). Must already exist.'
        required: true

permissions:
  # `softprops/action-gh-release` needs contents:write to create the
  # release and upload assets via the per-job GITHUB_TOKEN.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # v5, not v6: v6 moved caching into a closed-source component
        # whose separate Terms of Use the upgrade would accept. v5 is
        # already Node 24 and MIT throughout.
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore + write local.properties
        env:
          KEYSTORE_B64: ${{ secrets.HEXHOXHEX_KEYSTORE_B64 }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::HEXHOXHEX_KEYSTORE_B64 secret is empty"
            exit 1
          fi
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is empty — runtime would 401 on TMDB calls"
            exit 1
          fi
          mkdir -p "$HOME/.hexhoxhex"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.hexhoxhex/release.jks"
          # Pass paths + tokens through to gradle via the same local.properties
          # mechanism the local build uses. local.properties is gitignored
          # so this is throwaway scratch in the runner.
          #
          # TMDB_TOKEN ends up in BuildConfig at compile time via
          # app/build.gradle.kts buildConfigField. Without it the
          # Retrofit calls to api.themoviedb.org return 401 and the app
          # can't render any movie metadata — that was the user's
          # "github-built APK shows 401" report.
          cat > local.properties <<EOF
          HEXHOXHEX_KEYSTORE=$HOME/.hexhoxhex/release.jks
          HEXHOXHEX_STORE_PASS=${{ secrets.HEXHOXHEX_STORE_PASS }}
          HEXHOXHEX_KEY_ALIAS=${{ secrets.HEXHOXHEX_KEY_ALIAS }}
          HEXHOXHEX_KEY_PASS=${{ secrets.HEXHOXHEX_KEY_PASS }}
          TMDB_TOKEN=${TMDB_TOKEN}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK to include version
        id: apk
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          dst="vijanabarubaru-${{ steps.tag.outputs.tag }}.apk"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$dst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          # The first line is what the app's update banner shows (older
          # versions show only that), so it carries what people need to know:
          # after the update the TV prepares the app for a minute or two, and
          # opening it in that time does nothing.
          body: |
            After updating, give your TV a minute or two before opening the app: it prepares the new version first.

            Sideload APK signed with the hexhoxhex release key.

            **SHA-256:** `${{ steps.apk.outputs.sha256 }}`

            Install on a TV / phone:
            ```
            adb install -r vijanabarubaru-${{ steps.tag.outputs.tag }}.apk
            ```

  desktop:
    # The desktop app (desktop-web/: Tauri 2 + Next.js), one build per
    # system. Each uploads its installers as a workflow artifact; the
    # desktop-release job attaches them all at once, so the release notes
    # are edited by one job at a time.
    needs: [apk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-15
            name: macos
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop-web
    steps:
      - name: Resolve tag
        id: tag
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Linux build libraries
        if: matrix.name == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-web/src-tauri

      - name: Version from the tag
        run: |
          v="${{ steps.tag.outputs.tag }}"; v="${v#v}"
          node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version='$v';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build installers
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is empty: the catalogue would not load"
            exit 1
          fi
          bun install --frozen-lockfile
          bun run tauri build ${{ matrix.args }}

      - name: Collect installers
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p ../dist-desktop
          b=src-tauri/target
          case "${{ matrix.name }}" in
            windows)
              cp $b/release/bundle/nsis/*.exe "../dist-desktop/vijanabarubaru-$tag-windows-setup.exe"
              cp $b/release/bundle/msi/*.msi "../dist-desktop/vijanabarubaru-$tag-windows.msi" ;;
            macos)
              cp $b/universal-apple-darwin/release/bundle/dmg/*.dmg "../dist-desktop/vijanabarubaru-$tag-macos.dmg"
              # The bare .app as well, for signing and notarising on a Mac
              # (ditto keeps the bundle's links and attributes intact).
              app=$(ls -d $b/universal-apple-darwin/release/bundle/macos/*.app | head -1)
              ditto -c -k --keepParent "$app" "../dist-desktop/vijanabarubaru-$tag-macos-app.zip" ;;
            linux)
              cp $b/release/bundle/appimage/*.AppImage "../dist-desktop/vijanabarubaru-$tag-linux.AppImage"
              cp $b/release/bundle/deb/*.deb "../dist-desktop/vijanabarubaru-$tag-linux.deb" ;;
          esac
          ls -la ../dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-desktop/*
          if-no-files-found: error

  desktop-release:
    needs: [desktop]
    if: always() && needs.desktop.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop
          merge-multiple: true

      - name: Checksums
        id: sums
        run: |
          cd dist-desktop
          ls -la
          {
            echo "list<<EOF"
            for f in *; do echo "- $f: $(sha256sum "$f" | cut -d' ' -f1)"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach desktop installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: false
          append_body: true
          files: dist-desktop/*
          body: |

            **Desktop app** (Windows, macOS, Linux):
            - Windows: `-windows-setup.exe` (installs for you only, no admin needed) or `-windows.msi`. Had the old desktop app? Use the `.msi`: it replaces it.
            - macOS: `-macos.dmg` (Apple silicon and Intel). The build isn't notarised: the first time, right-click the app and choose Open. `-macos-app.zip` is the same app unpacked, for signing.
            - Linux: `-linux.AppImage` (make it executable and run it) or `-linux.deb`.

            Windows SmartScreen may warn because the build isn't code-signed: *More info*, then *Run anyway*.

            SHA-256:
            ${{ steps.sums.outputs.list }}

  ipa:
    # iPhone/iPad app. After the desktop installers as well as the apk: each
    # job edits the release notes, and two editing at once would lose one's
    # section. Still runs when only the desktop builds failed.
    needs: [apk, desktop-release]
    if: always() && needs.apk.result == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build the .ipa (unsigned)
        id: ipa
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ ! -f ios/project.yml ]; then
            echo "this tag has no iOS app"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          brew install xcodegen
          cd ios
          xcodegen generate
          status=0
          xcodebuild build \
            -project VijanaBaruBaru.xcodeproj -scheme VijanaBaruBaru \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${TAG#v}" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            TMDB_TOKEN="$TMDB_TOKEN" > ipa.log 2>&1 || status=$?
          grep -E "error:|\*\* " ipa.log || true
          [ $status -eq 0 ] || exit $status
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VijanaBaruBaru.app Payload/
          name="vijanabarubaru-$TAG.ipa"
          zip -qry "../$name" Payload
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "../$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach the .ipa to the release
        if: steps.ipa.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.ipa.outputs.path }}
          SHA: ${{ steps.ipa.outputs.sha256 }}
        run: |
          gh release upload "$TAG" "$NAME" --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          BUILT="for $TAG" python3 .github/scripts/ios_release_notes.py body.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
