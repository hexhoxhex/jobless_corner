name: Release APK, desktop and iPhone apps

# Cuts a GitHub release whenever a `v*.*.*` tag is pushed. Jobs:
#   - apk:               Ubuntu runner, signs with the hexhoxhex keystore.
#   - desktop:           the desktop app (desktop-web/, Tauri) for Windows
#                        and Linux (desktop-build.yml); unsigned.
#   - desktop-mac:       the same for macOS on Apple silicon, and
#     desktop-mac-intel: again on an Intel Mac when no Apple silicon runner
#                        could be had (GitHub often has none free).
#   - desktop-release:   attaches every desktop installer and writes the
#                        desktop section of the notes (replaced on a re-run).
#   - ipa, ipa-intel:    the iPhone/iPad app (ipa-build.yml), unsigned for
#                        Sideloadly, with the same Intel fallback.
# The release notes are edited by one job at a time (each waits for the last).
# A failed run can be repeated with "Re-run failed jobs" on its page.

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual re-run from the Actions tab if the tag-trigger build
  # failed before the upload step.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.20). Must already exist.'
        required: true

permissions:
  # `softprops/action-gh-release` needs contents:write to create the
  # release and upload assets via the per-job GITHUB_TOKEN.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # v5, not v6: v6 moved caching into a closed-source component
        # whose separate Terms of Use the upgrade would accept. v5 is
        # already Node 24 and MIT throughout.
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore + write local.properties
        env:
          KEYSTORE_B64: ${{ secrets.HEXHOXHEX_KEYSTORE_B64 }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::HEXHOXHEX_KEYSTORE_B64 secret is empty"
            exit 1
          fi
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is empty — runtime would 401 on TMDB calls"
            exit 1
          fi
          mkdir -p "$HOME/.hexhoxhex"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.hexhoxhex/release.jks"
          # Pass paths + tokens through to gradle via the same local.properties
          # mechanism the local build uses. local.properties is gitignored
          # so this is throwaway scratch in the runner.
          #
          # TMDB_TOKEN ends up in BuildConfig at compile time via
          # app/build.gradle.kts buildConfigField. Without it the
          # Retrofit calls to api.themoviedb.org return 401 and the app
          # can't render any movie metadata — that was the user's
          # "github-built APK shows 401" report.
          cat > local.properties <<EOF
          HEXHOXHEX_KEYSTORE=$HOME/.hexhoxhex/release.jks
          HEXHOXHEX_STORE_PASS=${{ secrets.HEXHOXHEX_STORE_PASS }}
          HEXHOXHEX_KEY_ALIAS=${{ secrets.HEXHOXHEX_KEY_ALIAS }}
          HEXHOXHEX_KEY_PASS=${{ secrets.HEXHOXHEX_KEY_PASS }}
          TMDB_TOKEN=${TMDB_TOKEN}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK to include version
        id: apk
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          dst="vijanabarubaru-${{ steps.tag.outputs.tag }}.apk"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$dst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          # The first line is what the app's update banner shows (older
          # versions show only that), so it carries what people need to know:
          # after the update the TV prepares the app for a minute or two, and
          # opening it in that time does nothing.
          body: |
            After updating, give your TV a minute or two before opening the app: it prepares the new version first.

            Sideload APK signed with the hexhoxhex release key.

            **SHA-256:** `${{ steps.apk.outputs.sha256 }}`

            Install on a TV / phone:
            ```
            adb install -r vijanabarubaru-${{ steps.tag.outputs.tag }}.apk
            ```

  # ---- desktop app (desktop-web/, Tauri), built by desktop-build.yml ----
  #
  # GitHub's Apple silicon Macs are often all taken: three releases lost
  # their macOS job to "The job was not acquired by Runner of type hosted
  # even after multiple attempts" after 15 minutes in the queue (v0.1.311,
  # v0.1.318, v0.1.320). Every macOS job therefore has a second try on an
  # Intel Mac (macos-15-intel, a separate pool), which makes the same
  # universal app and the same .ipa.

  desktop:
    needs: [apk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: ${{ matrix.os }}
      name: ${{ matrix.name }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  desktop-mac:
    needs: [apk]
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: macos-15
      name: macos
      args: "--target universal-apple-darwin"
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  desktop-mac-intel:
    # Only when the Apple silicon try didn't make it.
    needs: [desktop-mac]
    if: ${{ !cancelled() && needs.desktop-mac.result != 'success' && needs.desktop-mac.result != 'skipped' }}
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: macos-15-intel
      name: macos
      args: "--target universal-apple-darwin"
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  desktop-release:
    # Attaches whatever was built, and writes (or rewrites, on a re-run) the
    # desktop section of the notes.
    needs: [desktop, desktop-mac, desktop-mac-intel]
    if: ${{ !cancelled() && (needs.desktop.result == 'success' || needs.desktop-mac.result == 'success' || needs.desktop-mac-intel.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop
          merge-multiple: true

      - name: Attach desktop installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-desktop
          gh release upload "$TAG" dist-desktop/* --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 .github/scripts/desktop_release_notes.py body.md dist-desktop
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md

  # ---- iPhone/iPad app, built by ipa-build.yml ----

  ipa:
    # After the desktop installers as well as the apk: each job edits the
    # release notes, and two editing at once would lose one's section. Still
    # runs when the desktop builds failed.
    needs: [apk, desktop-release]
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    uses: ./.github/workflows/ipa-build.yml
    with:
      os: macos-15
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  ipa-intel:
    # Only when the Apple silicon try didn't make it.
    needs: [apk, ipa]
    if: ${{ !cancelled() && needs.apk.result == 'success' && needs.ipa.result != 'success' && needs.ipa.result != 'skipped' }}
    uses: ./.github/workflows/ipa-build.yml
    with:
      os: macos-15-intel
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit
