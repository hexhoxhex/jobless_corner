name: Desktop build (called by release.yml)

# One desktop build (desktop-web/: Tauri 2 + Next.js) on one system, its
# installers uploaded as the workflow artifact desktop-<name>. Called by
# release.yml once per system, and once more for macOS on an Intel runner
# when no Apple silicon runner could be had (see release.yml).

on:
  workflow_call:
    inputs:
      os:
        description: Runner label
        required: true
        type: string
      name:
        description: windows, macos or linux
        required: true
        type: string
      args:
        description: Extra arguments for `tauri build`
        required: false
        type: string
        default: ""
      tag:
        required: true
        type: string
    secrets:
      TMDB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop-web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Linux build libraries
        if: inputs.name == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-web/src-tauri

      - name: Version from the tag
        run: |
          v="${{ inputs.tag }}"; v="${v#v}"
          node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));c.version='$v';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build installers
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is empty: the catalogue would not load"
            exit 1
          fi
          echo "runner: ${{ inputs.os }} ($(uname -m))"
          bun install --frozen-lockfile
          bun run tauri build ${{ inputs.args }}

      - name: Collect installers
        run: |
          tag="${{ inputs.tag }}"
          mkdir -p ../dist-desktop
          b=src-tauri/target
          case "${{ inputs.name }}" in
            windows)
              cp $b/release/bundle/nsis/*.exe "../dist-desktop/vijanabarubaru-$tag-windows-setup.exe"
              cp $b/release/bundle/msi/*.msi "../dist-desktop/vijanabarubaru-$tag-windows.msi" ;;
            macos)
              cp $b/universal-apple-darwin/release/bundle/dmg/*.dmg "../dist-desktop/vijanabarubaru-$tag-macos.dmg"
              # The bare .app as well, for signing and notarising on a Mac
              # (ditto keeps the bundle's links and attributes intact).
              app=$(ls -d $b/universal-apple-darwin/release/bundle/macos/*.app | head -1)
              ditto -c -k --keepParent "$app" "../dist-desktop/vijanabarubaru-$tag-macos-app.zip" ;;
            linux)
              cp $b/release/bundle/appimage/*.AppImage "../dist-desktop/vijanabarubaru-$tag-linux.AppImage"
              cp $b/release/bundle/deb/*.deb "../dist-desktop/vijanabarubaru-$tag-linux.deb" ;;
          esac
          ls -la ../dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.name }}
          path: dist-desktop/*
          if-no-files-found: error
          # A re-run of a failed run uploads under the same name again.
          overwrite: true
